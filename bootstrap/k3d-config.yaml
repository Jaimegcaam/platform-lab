apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: platform-lab

# Minimal homelab: single node to reduce RAM usage on WSL
servers: 1
agents: 0

ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer

options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*

volumes:
  - volume: /tmp/platform-lab-storage:/var/lib/rancher/k3s/storage
    nodeFilters:
      - all
