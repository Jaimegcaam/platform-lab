service:
  type: ClusterIP

persistence:
  enabled: false

admin:
  existingSecret: grafana-admin-credentials
  userKey: admin-user
  passwordKey: admin-password

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        access: proxy
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: kubernetes
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes
      - name: platform
        orgId: 1
        folder: Platform
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/platform

# JSON dashboards in Git — fetched from GitHub when Argo CD renders the Helm chart
dashboards:
  kubernetes:
    k8s-views-global:
      url: https://raw.githubusercontent.com/Jaimegcaam/platform-lab/main/gitops/addons/grafana/dashboards/k8s-views-global.json
      datasource: Prometheus
    k8s-views-namespaces:
      url: https://raw.githubusercontent.com/Jaimegcaam/platform-lab/main/gitops/addons/grafana/dashboards/k8s-views-namespaces.json
      datasource: Prometheus
    k8s-views-pods:
      url: https://raw.githubusercontent.com/Jaimegcaam/platform-lab/main/gitops/addons/grafana/dashboards/k8s-views-pods.json
      datasource: Prometheus
    k8s-compute-cluster:
      url: https://raw.githubusercontent.com/Jaimegcaam/platform-lab/main/gitops/addons/grafana/dashboards/k8s-compute-cluster.json
      datasource: Prometheus
  platform:
    prometheus-overview:
      url: https://raw.githubusercontent.com/Jaimegcaam/platform-lab/main/gitops/addons/grafana/dashboards/prometheus-overview.json
      datasource: Prometheus
    argocd:
      url: https://raw.githubusercontent.com/Jaimegcaam/platform-lab/main/gitops/addons/grafana/dashboards/argocd.json
      datasource: Prometheus
